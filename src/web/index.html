<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iberian Energy Data Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        h2 {
            margin-top: 35px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: end;
            flex-wrap: wrap;

            padding: 20px;
            margin-bottom: 25px;

            background-color: #f5f5f5;
            border-radius: 8px;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
        }

        input,
        select,
        button {
            padding: 8px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
        }

        .message {
            margin: 15px 0;
            color: #666;
        }

        .chart-container {
            margin-bottom: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(160px, 1fr)
            );
            gap: 15px;
            margin: 20px 0 30px 0;
        }

        .stat-card {
            background-color: #f5f5f5;
            padding: 18px;
            border-radius: 8px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: right;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }
    </style>
</head>


<body>

    <h1>Iberian Energy Data Hub</h1>

    <p class="subtitle">
        OMIE day-ahead electricity market data
    </p>


    <!-- DAILY FILTERS -->

    <div class="controls">

        <div class="control">

            <label for="start-date">
                Start date
            </label>

            <input
                type="date"
                id="start-date"
            >

        </div>


        <div class="control">

            <label for="end-date">
                End date
            </label>

            <input
                type="date"
                id="end-date"
            >

        </div>


        <div class="control">

            <label for="zone">
                Market
            </label>

            <select id="zone">

                <option value="ALL">
                    Spain + Portugal
                </option>

                <option value="ES">
                    Spain
                </option>

                <option value="PT">
                    Portugal
                </option>

            </select>

        </div>


        <button id="apply-button">
            Apply filters
        </button>

        <button id="reset-button">
            Reset
        </button>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <!-- DAILY PRICE CHART -->

    <h2>Daily Average Prices</h2>

    <div class="chart-container">
        <canvas id="price-chart"></canvas>
    </div>


    <!-- INTRADAY SECTION -->

    <h2>15-Minute Intraday Prices</h2>

    <div class="controls">

        <div class="control">

            <label for="intraday-date">
                Market date
            </label>

            <input
                type="date"
                id="intraday-date"
            >

        </div>


        <button id="intraday-button">
            Load intraday prices
        </button>

    </div>


    <div
        id="intraday-message"
        class="message"
    ></div>


    <!-- INTRADAY STATISTICS -->

    <div
        id="intraday-stats"
        class="stats-grid"
    ></div>


    <!-- INTRADAY PRICE CHART -->

    <div class="chart-container">
        <canvas id="intraday-chart"></canvas>
    </div>


    <!-- SPREAD CHART -->

    <h3>Portugal - Spain Price Spread</h3>

    <div class="chart-container">
        <canvas id="spread-chart"></canvas>
    </div>


    <!-- DAILY SUMMARY TABLE -->

    <h2>Daily Market Summary</h2>

    <table>

        <thead>
            <tr id="table-header"></tr>
        </thead>

        <tbody id="market-data"></tbody>

    </table>


    <script>

        let priceChart = null;
        let intradayChart = null;
        let spreadChart = null;


        // --------------------------------------------------
        // DATE UTILITIES
        // --------------------------------------------------

        function formatDate(dateString) {

            return (
                dateString.slice(0, 4)
                + "-"
                + dateString.slice(4, 6)
                + "-"
                + dateString.slice(6, 8)
            );
        }


        function convertDateForApi(dateString) {

            if (!dateString) {
                return null;
            }

            return dateString.replaceAll("-", "");
        }


        // --------------------------------------------------
        // DAILY API URL
        // --------------------------------------------------

        function buildApiUrl() {

            const startDate =
                convertDateForApi(
                    document.getElementById(
                        "start-date"
                    ).value
                );


            const endDate =
                convertDateForApi(
                    document.getElementById(
                        "end-date"
                    ).value
                );


            const parameters =
                new URLSearchParams();


            if (startDate) {

                parameters.append(
                    "start_date",
                    startDate
                );
            }


            if (endDate) {

                parameters.append(
                    "end_date",
                    endDate
                );
            }


            const queryString =
                parameters.toString();


            if (queryString) {

                return (
                    "/omie/daily-summary?"
                    + queryString
                );
            }


            return "/omie/daily-summary";
        }


        // --------------------------------------------------
        // DAILY CHART DATASETS
        // --------------------------------------------------

        function createDatasets(
            data,
            zone
        ) {

            const datasets = [];


            if (
                zone === "ALL"
                || zone === "ES"
            ) {

                datasets.push({
                    label: "Spain",
                    data: data.map(
                        row => row.avg_price_es
                    ),
                    tension: 0.2
                });
            }


            if (
                zone === "ALL"
                || zone === "PT"
            ) {

                datasets.push({
                    label: "Portugal",
                    data: data.map(
                        row => row.avg_price_pt
                    ),
                    tension: 0.2
                });
            }


            return datasets;
        }


        // --------------------------------------------------
        // DAILY TABLE
        // --------------------------------------------------

        function renderTable(
            data,
            zone
        ) {

            const tableHeader =
                document.getElementById(
                    "table-header"
                );


            const tableBody =
                document.getElementById(
                    "market-data"
                );


            tableHeader.innerHTML = "";
            tableBody.innerHTML = "";


            if (zone === "ES") {

                tableHeader.innerHTML = `
                    <th>Date</th>
                    <th>Spain €/MWh</th>
                `;

            } else if (zone === "PT") {

                tableHeader.innerHTML = `
                    <th>Date</th>
                    <th>Portugal €/MWh</th>
                `;

            } else {

                tableHeader.innerHTML = `
                    <th>Date</th>
                    <th>Spain €/MWh</th>
                    <th>Portugal €/MWh</th>
                    <th>Split Periods</th>
                    <th>Max Spread €/MWh</th>
                `;
            }


            for (const row of data) {

                const tableRow =
                    document.createElement("tr");


                if (zone === "ES") {

                    tableRow.innerHTML = `
                        <td>
                            ${formatDate(row.market_date)}
                        </td>

                        <td>
                            ${row.avg_price_es.toFixed(2)}
                        </td>
                    `;

                } else if (zone === "PT") {

                    tableRow.innerHTML = `
                        <td>
                            ${formatDate(row.market_date)}
                        </td>

                        <td>
                            ${row.avg_price_pt.toFixed(2)}
                        </td>
                    `;

                } else {

                    tableRow.innerHTML = `
                        <td>
                            ${formatDate(row.market_date)}
                        </td>

                        <td>
                            ${row.avg_price_es.toFixed(2)}
                        </td>

                        <td>
                            ${row.avg_price_pt.toFixed(2)}
                        </td>

                        <td>
                            ${row.split_periods}
                        </td>

                        <td>
                            ${row.max_spread.toFixed(2)}
                        </td>
                    `;
                }


                tableBody.appendChild(
                    tableRow
                );
            }
        }


        // --------------------------------------------------
        // DAILY CHART
        // --------------------------------------------------

        function renderChart(
            data,
            zone
        ) {

            const dates =
                data.map(
                    row =>
                        formatDate(
                            row.market_date
                        )
                );


            if (priceChart) {
                priceChart.destroy();
            }


            const chartContext =
                document.getElementById(
                    "price-chart"
                );


            priceChart =
                new Chart(
                    chartContext,
                    {

                        type: "line",

                        data: {

                            labels: dates,

                            datasets:
                                createDatasets(
                                    data,
                                    zone
                                )
                        },

                        options: {

                            responsive: true,

                            interaction: {
                                mode: "index",
                                intersect: false
                            },

                            plugins: {

                                title: {
                                    display: true,
                                    text:
                                        "OMIE Daily Average Day-Ahead Prices"
                                }
                            },

                            scales: {

                                y: {

                                    title: {
                                        display: true,
                                        text: "€/MWh"
                                    }
                                },

                                x: {

                                    title: {
                                        display: true,
                                        text: "Market date"
                                    }
                                }
                            }
                        }
                    }
                );
        }


        // --------------------------------------------------
        // LOAD DAILY DATA
        // --------------------------------------------------

        async function loadMarketData() {

            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                "Loading market data...";


            const zone =
                document.getElementById(
                    "zone"
                ).value;


            try {

                const response =
                    await fetch(
                        buildApiUrl()
                    );


                if (!response.ok) {

                    const errorData =
                        await response.json();


                    throw new Error(
                        errorData.detail
                        || "Unable to load data."
                    );
                }


                const data =
                    await response.json();


                if (data.length === 0) {

                    message.textContent =
                        "No market data found for this period.";

                    return;
                }


                if (
                    !document.getElementById(
                        "start-date"
                    ).value
                ) {

                    document.getElementById(
                        "start-date"
                    ).value =
                        formatDate(
                            data[0].market_date
                        );
                }


                if (
                    !document.getElementById(
                        "end-date"
                    ).value
                ) {

                    document.getElementById(
                        "end-date"
                    ).value =
                        formatDate(
                            data[
                                data.length - 1
                            ].market_date
                        );
                }


                if (
                    !document.getElementById(
                        "intraday-date"
                    ).value
                ) {

                    document.getElementById(
                        "intraday-date"
                    ).value =
                        formatDate(
                            data[
                                data.length - 1
                            ].market_date
                        );
                }


                renderChart(
                    data,
                    zone
                );


                renderTable(
                    data,
                    zone
                );


                message.textContent =
                    `${data.length} day(s) loaded.`;

            } catch (error) {

                message.textContent =
                    "Error: " + error.message;
            }
        }


        // --------------------------------------------------
        // LOAD INTRADAY DATA
        // --------------------------------------------------

        async function loadIntradayData() {

            const dateInput =
                document.getElementById(
                    "intraday-date"
                ).value;


            const message =
                document.getElementById(
                    "intraday-message"
                );


            const statsContainer =
                document.getElementById(
                    "intraday-stats"
                );


            if (!dateInput) {

                message.textContent =
                    "Please select a market date.";

                return;
            }


            const apiDate =
                convertDateForApi(
                    dateInput
                );


            message.textContent =
                "Loading intraday prices...";


            try {

                const response =
                    await fetch(
                        `/omie/intraday?date=${apiDate}`
                    );


                if (!response.ok) {

                    const errorData =
                        await response.json();


                    throw new Error(
                        errorData.detail
                        || "Unable to load intraday data."
                    );
                }


                const data =
                    await response.json();


                if (data.length === 0) {

                    message.textContent =
                        "No intraday data found for this date.";

                    statsContainer.innerHTML = "";

                    if (intradayChart) {
                        intradayChart.destroy();
                        intradayChart = null;
                    }

                    if (spreadChart) {
                        spreadChart.destroy();
                        spreadChart = null;
                    }

                    return;
                }


                // -----------------------------
                // PREPARE DATA
                // -----------------------------

                const times =
                    data.map(
                        row =>
                            row.timestamp_market.slice(
                                11,
                                16
                            )
                    );


                const spanishPrices =
                    data.map(
                        row => row.price_es
                    );


                const portuguesePrices =
                    data.map(
                        row => row.price_pt
                    );


                const spreads =
                    data.map(
                        row => row.pt_minus_es
                    );


                // -----------------------------
                // CALCULATE STATISTICS
                // -----------------------------

                const averageSpain =
                    spanishPrices.reduce(
                        (sum, value) =>
                            sum + value,
                        0
                    )
                    /
                    spanishPrices.length;


                const averagePortugal =
                    portuguesePrices.reduce(
                        (sum, value) =>
                            sum + value,
                        0
                    )
                    /
                    portuguesePrices.length;


                const minimumSpain =
                    Math.min(
                        ...spanishPrices
                    );


                const maximumSpain =
                    Math.max(
                        ...spanishPrices
                    );


                const minimumPortugal =
                    Math.min(
                        ...portuguesePrices
                    );


                const maximumPortugal =
                    Math.max(
                        ...portuguesePrices
                    );


                const splitPeriods =
                    spreads.filter(
                        value =>
                            Math.abs(value) > 0.001
                    ).length;


                const maximumSpread =
                    Math.max(
                        ...spreads.map(
                            value =>
                                Math.abs(value)
                        )
                    );


                const negativeSpain =
                    spanishPrices.filter(
                        value => value < 0
                    ).length;


                const negativePortugal =
                    portuguesePrices.filter(
                        value => value < 0
                    ).length;


                // -----------------------------
                // STATISTIC CARDS
                // -----------------------------

                statsContainer.innerHTML = `

                    <div class="stat-card">

                        <div class="stat-label">
                            Spain average
                        </div>

                        <div class="stat-value">
                            ${averageSpain.toFixed(2)}
                            €/MWh
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-label">
                            Portugal average
                        </div>

                        <div class="stat-value">
                            ${averagePortugal.toFixed(2)}
                            €/MWh
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-label">
                            Spain min / max
                        </div>

                        <div class="stat-value">
                            ${minimumSpain.toFixed(2)}
                            /
                            ${maximumSpain.toFixed(2)}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-label">
                            Portugal min / max
                        </div>

                        <div class="stat-value">
                            ${minimumPortugal.toFixed(2)}
                            /
                            ${maximumPortugal.toFixed(2)}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-label">
                            Split periods
                        </div>

                        <div class="stat-value">
                            ${splitPeriods}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-label">
                            Maximum spread
                        </div>

                        <div class="stat-value">
                            ${maximumSpread.toFixed(2)}
                            €/MWh
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-label">
                            Negative periods ES
                        </div>

                        <div class="stat-value">
                            ${negativeSpain}
                        </div>

                    </div>


                    <div class="stat-card">

                        <div class="stat-label">
                            Negative periods PT
                        </div>

                        <div class="stat-value">
                            ${negativePortugal}
                        </div>

                    </div>

                `;


                // -----------------------------
                // INTRADAY PRICE CHART
                // -----------------------------

                if (intradayChart) {
                    intradayChart.destroy();
                }


                const chartContext =
                    document.getElementById(
                        "intraday-chart"
                    );


                intradayChart =
                    new Chart(
                        chartContext,
                        {

                            type: "line",

                            data: {

                                labels: times,

                                datasets: [

                                    {
                                        label: "Spain",
                                        data: spanishPrices,
                                        tension: 0.1,
                                        pointRadius: 2
                                    },

                                    {
                                        label: "Portugal",
                                        data: portuguesePrices,
                                        tension: 0.1,
                                        pointRadius: 2
                                    }
                                ]
                            },

                            options: {

                                responsive: true,

                                interaction: {
                                    mode: "index",
                                    intersect: false
                                },

                                plugins: {

                                    title: {
                                        display: true,
                                        text:
                                            "15-Minute OMIE Day-Ahead Prices"
                                    }
                                },

                                scales: {

                                    y: {

                                        title: {
                                            display: true,
                                            text: "€/MWh"
                                        }
                                    },

                                    x: {

                                        title: {
                                            display: true,
                                            text: "Market time"
                                        }
                                    }
                                }
                            }
                        }
                    );


                // -----------------------------
                // SPREAD CHART
                // -----------------------------

                if (spreadChart) {
                    spreadChart.destroy();
                }


                const spreadContext =
                    document.getElementById(
                        "spread-chart"
                    );


                spreadChart =
                    new Chart(
                        spreadContext,
                        {

                            type: "line",

                            data: {

                                labels: times,

                                datasets: [

                                    {
                                        label:
                                            "Portugal - Spain",

                                        data: spreads,

                                        tension: 0.1,

                                        pointRadius: 2
                                    }
                                ]
                            },

                            options: {

                                responsive: true,

                                interaction: {
                                    mode: "index",
                                    intersect: false
                                },

                                plugins: {

                                    title: {
                                        display: true,
                                        text:
                                            "ES-PT Day-Ahead Price Spread"
                                    }
                                },

                                scales: {

                                    y: {

                                        title: {
                                            display: true,
                                            text:
                                                "PT - ES (€/MWh)"
                                        }
                                    },

                                    x: {

                                        title: {
                                            display: true,
                                            text: "Market time"
                                        }
                                    }
                                }
                            }
                        }
                    );


                message.textContent =
                    `${data.length} market periods loaded.`;

            } catch (error) {

                message.textContent =
                    "Error: " + error.message;
            }
        }


        // --------------------------------------------------
        // BUTTONS
        // --------------------------------------------------

        document.getElementById(
            "apply-button"
        ).addEventListener(
            "click",
            loadMarketData
        );


        document.getElementById(
            "reset-button"
        ).addEventListener(
            "click",
            function () {

                document.getElementById(
                    "start-date"
                ).value = "";


                document.getElementById(
                    "end-date"
                ).value = "";


                document.getElementById(
                    "zone"
                ).value = "ALL";


                loadMarketData();
            }
        );


        document.getElementById(
            "intraday-button"
        ).addEventListener(
            "click",
            loadIntradayData
        );


        // --------------------------------------------------
        // INITIAL PAGE LOAD
        // --------------------------------------------------

        loadMarketData();

    </script>

</body>

</html>
