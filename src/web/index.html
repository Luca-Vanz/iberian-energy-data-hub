<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iberian Energy Data Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --background: #f5f7fa;
            --surface: #ffffff;
            --border: #d9e0e8;
            --text: #172033;
            --muted: #687386;
            --primary: #1769aa;
            --primary-dark: #0e4f82;
            --danger: #b42318;
            --success: #18794e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: var(--background);
            color: var(--text);
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            max-width: 1450px;
            margin: 0 auto;
            padding: 24px 28px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin-top: 7px;
            color: var(--muted);
            font-size: 15px;
        }

        main {
            max-width: 1450px;
            margin: 0 auto;
            padding: 28px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 22px;
        }

        .panel-title {
            margin: 0 0 18px 0;
            font-size: 19px;
            font-weight: 650;
        }

        .controls {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(170px, 1fr)
                );
            gap: 16px;
            align-items: end;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #3c4758;
        }

        select,
        input,
        button {
            min-height: 42px;
            border-radius: 7px;
            font-size: 14px;
        }

        select,
        input {
            border: 1px solid #cbd3dd;
            padding: 0 11px;
            background: white;
            color: var(--text);
        }

        select:focus,
        input:focus {
            outline: 2px solid rgba(23, 105, 170, 0.2);
            border-color: var(--primary);
        }

        button {
            border: none;
            padding: 0 20px;
            background: var(--primary);
            color: white;
            font-weight: 650;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .hidden {
            display: none !important;
        }

        .status {
            margin-top: 17px;
            padding: 11px 14px;
            border-radius: 7px;
            font-size: 14px;
            background: #f1f4f8;
            color: var(--muted);
        }

        .status.error {
            background: #fff0ee;
            color: var(--danger);
        }

        .status.success {
            background: #edf8f2;
            color: var(--success);
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-bottom: 16px;
        }

        .summary-chip {
            padding: 7px 11px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            background: #fafbfd;
            color: #4b5668;
        }

        .chart-wrapper {
            position: relative;
            height: 590px;
            width: 100%;
        }

        #emptyMessage {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--muted);
            text-align: center;
            padding: 30px;
            pointer-events: none;
        }

        .note {
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--muted);
        }

        .events {
            margin-top: 18px;
        }

        .event {
            padding: 10px 0;
            border-top: 1px solid #edf0f4;
            font-size: 13px;
            line-height: 1.5;
        }

        .event:first-child {
            border-top: 0;
        }

        .event-date {
            font-weight: 650;
        }

        .event-title {
            font-weight: 600;
        }

        @media (max-width: 700px) {
            main {
                padding: 14px;
            }

            .header-inner {
                padding: 20px 16px;
            }

            h1 {
                font-size: 24px;
            }

            .chart-wrapper {
                height: 430px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>Iberian Energy Data Hub</h1>

        <div class="subtitle">
            Historical electricity-market prices for Spain and Portugal
        </div>
    </div>
</header>

<main>

    <section class="panel">

        <h2 class="panel-title">
            Price explorer
        </h2>

        <div class="controls">

            <div class="control">
                <label for="market">
                    Price series
                </label>

                <select id="market">
                    <option value="day_ahead">
                        Day-ahead
                    </option>

                    <option value="intraday_auction">
                        Intraday auction
                    </option>

                    <option value="intraday_continuous">
                        Continuous intraday
                    </option>

                    <option value="afrr_energy">
                        aFRR energy
                    </option>

                    <option value="afrr_capacity">
                        aFRR capacity — marginal
                    </option>

                    <option value="mfrr_scheduled">
                        mFRR scheduled activation
                    </option>

                    <option value="rr">
                        Replacement reserve (RR)
                    </option>
                </select>
            </div>


            <div class="control">
                <label for="country">
                    Country
                </label>

                <select id="country">
                    <option value="both">
                        Spain + Portugal
                    </option>

                    <option value="ES">
                        Spain
                    </option>

                    <option value="PT">
                        Portugal
                    </option>
                </select>
            </div>


            <div
                class="control hidden"
                id="directionControl"
            >
                <label for="direction">
                    Direction
                </label>

                <select id="direction">
                    <option value="both">
                        UP + DOWN
                    </option>

                    <option value="up">
                        UP
                    </option>

                    <option value="down">
                        DOWN
                    </option>
                </select>
            </div>


            <div
                class="control hidden"
                id="sessionControl"
            >
                <label for="session">
                    Auction session
                </label>

                <select id="session">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </div>


            <div class="control">
                <label for="frequency">
                    Display frequency
                </label>

                <select id="frequency">
                    <option value="15min">
                        15 minutes
                    </option>

                    <option
                        value="1h"
                        selected
                    >
                        Hourly
                    </option>

                    <option value="daily">
                        Daily
                    </option>

                    <option value="weekly">
                        Weekly
                    </option>

                    <option value="monthly">
                        Monthly
                    </option>

                    <option value="yearly">
                        Yearly
                    </option>
                </select>
            </div>


            <div class="control">
                <label for="startDate">
                    Start date
                </label>

                <input
                    id="startDate"
                    type="date"
                >
            </div>


            <div class="control">
                <label for="endDate">
                    End date
                </label>

                <input
                    id="endDate"
                    type="date"
                >
            </div>


            <div class="control">
                <button id="loadButton">
                    Load prices
                </button>
            </div>

        </div>

        <div
            id="status"
            class="status"
        >
            Select a price series and load the data.
        </div>

    </section>


    <section class="panel">

        <h2 class="panel-title">
            Electricity price
        </h2>

        <div
            id="summary"
            class="summary"
        ></div>

        <div class="chart-wrapper">

            <canvas id="priceChart"></canvas>

            <div
                id="emptyMessage"
                class="hidden"
            >
                No official data are available for this selection.
            </div>

        </div>

        <div
            id="resolutionNote"
            class="note hidden"
        ></div>

        <div
            id="events"
            class="events"
        ></div>

    </section>

</main>


<script>
    // ==================================================
    // ELEMENTS
    // ==================================================

    const marketElement =
        document.getElementById("market");

    const countryElement =
        document.getElementById("country");

    const directionElement =
        document.getElementById("direction");

    const directionControl =
        document.getElementById("directionControl");

    const sessionElement =
        document.getElementById("session");

    const sessionControl =
        document.getElementById("sessionControl");

    const frequencyElement =
        document.getElementById("frequency");

    const startDateElement =
        document.getElementById("startDate");

    const endDateElement =
        document.getElementById("endDate");

    const loadButton =
        document.getElementById("loadButton");

    const statusElement =
        document.getElementById("status");

    const summaryElement =
        document.getElementById("summary");

    const emptyMessage =
        document.getElementById("emptyMessage");

    const resolutionNote =
        document.getElementById("resolutionNote");

    const eventsElement =
        document.getElementById("events");


    // ==================================================
    // DEFAULT DATES
    // ==================================================

    function formatDateInput(date) {
        return date
            .toISOString()
            .slice(0, 10);
    }


    const defaultEnd = new Date();

    defaultEnd.setDate(
        defaultEnd.getDate() - 1
    );

    const defaultStart =
        new Date(defaultEnd);

    defaultStart.setDate(
        defaultStart.getDate() - 7
    );

    startDateElement.value =
        formatDateInput(defaultStart);

    endDateElement.value =
        formatDateInput(defaultEnd);


    // ==================================================
    // MARKET CONFIGURATION
    //
    // The dashboard uses economic labels.
    // The backend still preserves exact source fields.
    // ==================================================

    const SERIES_CONFIG = {

        day_ahead: {
            market: "day_ahead",
            balancing: false
        },

        intraday_auction: {
            market: "intraday_auction",
            balancing: false,
            session: true
        },

        intraday_continuous: {
            market: "intraday_continuous",
            balancing: false
        },

        afrr_energy: {
            market: "afrr",
            balancing: true,
            direction: true,
            stage: "energy",
            metric: "marginal_price"
        },

        afrr_capacity: {
            market: "afrr",
            balancing: true,
            direction: true,
            stage: "capacity",
            metric: "marginal_price"
        },

        mfrr_scheduled: {
            market: "mfrr",
            balancing: true,
            direction: true,
            special: "mfrr_scheduled"
        },

        rr: {
            market: "rr",
            balancing: true,
            direction: false,
            stage: null,
            metric: "activation_price"
        }
    };


    // ==================================================
    // CONTROL VISIBILITY
    // ==================================================

    function updateControls() {

        const config =
            SERIES_CONFIG[
                marketElement.value
            ];

        directionControl.classList.toggle(
            "hidden",
            !config.direction
        );

        sessionControl.classList.toggle(
            "hidden",
            !config.session
        );
    }


    marketElement.addEventListener(
        "change",
        updateControls
    );

    updateControls();


    // ==================================================
    // STATUS
    // ==================================================

    function setStatus(
        message,
        type = "normal"
    ) {

        statusElement.textContent =
            message;

        statusElement.className =
            "status";

        if (type === "error") {
            statusElement.classList.add(
                "error"
            );
        }

        if (type === "success") {
            statusElement.classList.add(
                "success"
            );
        }
    }


    // ==================================================
    // API QUERY
    // ==================================================

    function buildUrl(
        config,
        country,
        overrides = {}
    ) {

        const params =
            new URLSearchParams();

        params.set(
            "market",
            config.market
        );

        params.set(
            "country",
            country
        );

        params.set(
            "start_date",
            startDateElement.value
        );

        params.set(
            "end_date",
            endDateElement.value
        );

        params.set(
            "frequency",
            frequencyElement.value
        );

        if (
            config.direction
            && directionElement.value
        ) {
            params.set(
                "direction",
                directionElement.value
            );
        }

        if (config.session) {
            params.set(
                "session",
                sessionElement.value
            );
        }

        if (config.stage) {
            params.set(
                "stage",
                config.stage
            );
        }

        if (config.metric) {
            params.set(
                "metric",
                config.metric
            );
        }

        for (
            const [key, value]
            of Object.entries(overrides)
        ) {

            if (
                value !== null
                && value !== undefined
            ) {

                params.set(
                    key,
                    value
                );
            }
        }

        return (
            "/market/prices?"
            + params.toString()
        );
    }


    async function fetchJson(url) {

        const response =
            await fetch(url);

        const payload =
            await response.json();

        if (!response.ok) {

            const detail =
                payload.detail
                || `HTTP ${response.status}`;

            throw new Error(
                detail
            );
        }

        return payload;
    }


    // ==================================================
    // mFRR
    //
    // Spain and Portugal currently expose the
    // official scheduled-activation series under
    // different source metric names.
    //
    // We therefore request each country separately
    // instead of pretending their raw schemas are
    // identical.
    // ==================================================

    async function fetchMfrrScheduled(
        requestedCountry,
        config
    ) {

        const countries =
            requestedCountry === "both"
                ? ["ES", "PT"]
                : [requestedCountry];

        const requests =
            countries.map(
                async country => {

                    const overrides =
                        country === "ES"
                            ? {
                                stage:
                                    "energy_scheduled",

                                metric:
                                    "weighted_average_price"
                            }
                            : {
                                stage:
                                    "energy_scheduled",

                                metric:
                                    "scheduled_activation_price"
                            };

                    const url =
                        buildUrl(
                            config,
                            country,
                            overrides
                        );

                    return fetchJson(
                        url
                    );
                }
            );

        const results =
            await Promise.all(
                requests
            );

        const data =
            results.flatMap(
                result =>
                    result.data || []
            );

        const events =
            results.flatMap(
                result =>
                    result.events || []
            );

        const upsampledPoints =
            data.filter(
                row =>
                    row.is_upsampled
            ).length;

        return {
            metadata: {
                market:
                    "mfrr",

                countries:
                    countries,

                start_date:
                    startDateElement.value,

                end_date:
                    endDateElement.value,

                frequency:
                    frequencyElement.value,

                rows:
                    data.length,

                series:
                    new Set(
                        data.map(
                            row =>
                                row.series_id
                        )
                    ).size,

                upsampled_points:
                    upsampledPoints
            },

            events:
                events,

            data:
                data
        };
    }


    async function loadData() {

        const config =
            SERIES_CONFIG[
                marketElement.value
            ];

        const requestedCountry =
            countryElement.value;

        if (
            !startDateElement.value
            || !endDateElement.value
        ) {

            throw new Error(
                "Select both start and end dates."
            );
        }

        if (
            startDateElement.value
            > endDateElement.value
        ) {

            throw new Error(
                "Start date must be before end date."
            );
        }

        if (
            config.special
            === "mfrr_scheduled"
        ) {

            return fetchMfrrScheduled(
                requestedCountry,
                config
            );
        }

        const url =
            buildUrl(
                config,
                requestedCountry
            );

        return fetchJson(
            url
        );
    }


    // ==================================================
    // LABELS
    // ==================================================

    function marketLabel(value) {

        const labels = {
            day_ahead:
                "Day-ahead",

            intraday_auction:
                "Intraday auction",

            intraday_continuous:
                "Continuous intraday",

            afrr_energy:
                "aFRR energy",

            afrr_capacity:
                "aFRR capacity",

            mfrr_scheduled:
                "mFRR scheduled activation",

            rr:
                "Replacement reserve"
        };

        return (
            labels[value]
            || value
        );
    }


    function seriesLabel(row) {

        const pieces = [
            row.country
        ];

        if (
            row.direction
            && row.direction !== "none"
        ) {

            pieces.push(
                row.direction.toUpperCase()
            );
        }

        if (
            row.session !== null
            && row.session !== undefined
            && row.market
                === "intraday_auction"
        ) {

            pieces.push(
                `Session ${row.session}`
            );
        }

        if (
            row.metric
            && ![
                "price",
                "marginal_price"
            ].includes(
                row.metric
            )
        ) {

            pieces.push(
                row.metric
                    .replaceAll("_", " ")
            );
        }

        return pieces.join(
            " — "
        );
    }


    // ==================================================
    // COLORS
    // ==================================================

    const SERIES_COLORS = [
        "#1769aa",
        "#d1495b",
        "#2a9d8f",
        "#7b2cbf",
        "#e07a5f",
        "#4f772d",
        "#bc6c25",
        "#495057"
    ];


    // ==================================================
    // CHART EVENT MARKERS
    // ==================================================

    const marketEventsPlugin = {

        id: "marketEvents",

        afterDatasetsDraw(
            chart,
            args,
            pluginOptions
        ) {

            const events =
                pluginOptions.events
                || [];

            if (!events.length) {
                return;
            }

            const {
                ctx,
                chartArea,
                scales
            } = chart;

            ctx.save();

            for (
                const event
                of events
            ) {

                const x =
                    scales.x.getPixelForValue(
                        event.x
                    );

                if (
                    x < chartArea.left
                    || x > chartArea.right
                ) {
                    continue;
                }

                ctx.beginPath();

                ctx.setLineDash(
                    [5, 5]
                );

                ctx.strokeStyle =
                    "#8a94a5";

                ctx.lineWidth = 1;

                ctx.moveTo(
                    x,
                    chartArea.top
                );

                ctx.lineTo(
                    x,
                    chartArea.bottom
                );

                ctx.stroke();

                ctx.setLineDash([]);

                ctx.fillStyle =
                    "#5f6b7a";

                ctx.font =
                    "11px sans-serif";

                ctx.save();

                ctx.translate(
                    x + 4,
                    chartArea.top + 8
                );

                ctx.rotate(
                    Math.PI / 2
                );

                ctx.fillText(
                    event.title,
                    0,
                    0
                );

                ctx.restore();
            }

            ctx.restore();
        }
    };


    Chart.register(
        marketEventsPlugin
    );


    // ==================================================
    // CHART
    // ==================================================

    let chart = null;


    function timestampLabel(
        timestamp
    ) {

        const date =
            new Date(timestamp);

        return new Intl.DateTimeFormat(
            "en-GB",
            {
                year: "numeric",
                month: "short",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        ).format(date);
    }


    function buildEventMarkers(
        events,
        data
    ) {

        if (!events?.length) {
            return [];
        }

        const result = [];

        for (
            const event
            of events
        ) {

            const matchingPoint =
                data.find(
                    row =>
                        row.timestamp_market
                            ?.startsWith(
                                event.event_date
                            )
                );

            if (!matchingPoint) {
                continue;
            }

            result.push(
                {
                    x:
                        new Date(
                            matchingPoint
                                .timestamp_utc
                        ).getTime(),

                    title:
                        event.title,

                    date:
                        event.event_date
                }
            );
        }

        return result;
    }


    function drawChart(result) {

        const rows =
            result.data || [];

        if (chart) {

            chart.destroy();

            chart = null;
        }

        if (!rows.length) {

            emptyMessage.classList.remove(
                "hidden"
            );

            return;
        }

        emptyMessage.classList.add(
            "hidden"
        );

        const grouped =
            new Map();

        for (
            const row
            of rows
        ) {

            if (
                !grouped.has(
                    row.series_id
                )
            ) {

                grouped.set(
                    row.series_id,
                    []
                );
            }

            grouped.get(
                row.series_id
            ).push(
                row
            );
        }

        const datasets = [];

        let colorIndex = 0;

        for (
            const [
                seriesId,
                seriesRows
            ]
            of grouped.entries()
        ) {

            seriesRows.sort(
                (a, b) =>
                    new Date(
                        a.timestamp_utc
                    )
                    -
                    new Date(
                        b.timestamp_utc
                    )
            );

            const first =
                seriesRows[0];

            const color =
                SERIES_COLORS[
                    colorIndex
                    % SERIES_COLORS.length
                ];

            colorIndex += 1;

            datasets.push(
                {
                    label:
                        seriesLabel(
                            first
                        ),

                    data:
                        seriesRows.map(
                            row => ({
                                x:
                                    new Date(
                                        row.timestamp_utc
                                    ).getTime(),

                                y:
                                    row.value,

                                upsampled:
                                    row.is_upsampled,

                                nativeResolution:
                                    row.native_resolution_minutes,

                                marketTimestamp:
                                    row.timestamp_market,

                                source:
                                    row.source,

                                sourceId:
                                    row.source_id,

                                unit:
                                    row.unit
                            })
                        ),

                    borderColor:
                        color,

                    backgroundColor:
                        color,

                    borderWidth:
                        1.8,

                    pointRadius:
                        0,

                    pointHitRadius:
                        8,

                    tension:
                        0,

                    spanGaps:
                        false,

                    segment: {

                        borderDash:
                            context => {

                                const p0 =
                                    context.p0.raw;

                                const p1 =
                                    context.p1.raw;

                                if (
                                    p0?.upsampled
                                    || p1?.upsampled
                                ) {

                                    return [
                                        6,
                                        4
                                    ];
                                }

                                return undefined;
                            }
                    }
                }
            );
        }

        const eventMarkers =
            buildEventMarkers(
                result.events || [],
                rows
            );

        const context =
            document
                .getElementById(
                    "priceChart"
                )
                .getContext("2d");

        chart =
            new Chart(
                context,
                {
                    type:
                        "line",

                    data: {
                        datasets:
                            datasets
                    },

                    options: {

                        responsive:
                            true,

                        maintainAspectRatio:
                            false,

                        interaction: {
                            mode:
                                "nearest",

                            intersect:
                                false,

                            axis:
                                "x"
                        },

                        parsing:
                            false,

                        plugins: {

                            legend: {
                                position:
                                    "top"
                            },

                            tooltip: {

                                callbacks: {

                                    title:
                                        items => {

                                            if (
                                                !items.length
                                            ) {
                                                return "";
                                            }

                                            return timestampLabel(
                                                items[0]
                                                    .raw
                                                    .x
                                            );
                                        },

                                    label:
                                        context => {

                                            const raw =
                                                context.raw;

                                            return (
                                                `${context.dataset.label}: `
                                                + `${raw.y.toFixed(2)} `
                                                + `${raw.unit}`
                                            );
                                        },

                                    afterLabel:
                                        context => {

                                            const raw =
                                                context.raw;

                                            const details = [
                                                `Source: ${raw.source}`
                                            ];

                                            if (
                                                raw.nativeResolution
                                                !== null
                                                && raw.nativeResolution
                                                !== undefined
                                            ) {

                                                details.push(
                                                    `Native resolution: `
                                                    + `${raw.nativeResolution} min`
                                                );
                                            }

                                            if (
                                                raw.upsampled
                                            ) {

                                                details.push(
                                                    "Displayed at finer resolution "
                                                    + "by repeating the native value"
                                                );
                                            }

                                            return details;
                                        }
                                }
                            },

                            marketEvents: {
                                events:
                                    eventMarkers
                            }
                        },

                        scales: {

                            x: {

                                type:
                                    "linear",

                                ticks: {

                                    maxTicksLimit:
                                        10,

                                    callback:
                                        value => {

                                            const date =
                                                new Date(
                                                    value
                                                );

                                            return new Intl.DateTimeFormat(
                                                "en-GB",
                                                {
                                                    month:
                                                        "short",

                                                    day:
                                                        "2-digit",

                                                    hour:
                                                        "2-digit",

                                                    minute:
                                                        "2-digit"
                                                }
                                            ).format(
                                                date
                                            );
                                        }
                                },

                                title: {
                                    display:
                                        true,

                                    text:
                                        "Market time"
                                }
                            },

                            y: {

                                title: {
                                    display:
                                        true,

                                    text:
                                        rows[0]
                                            ?.unit
                                            || "Price"
                                }
                            }
                        }
                    }
                }
            );
    }


    // ==================================================
    // SUMMARY
    // ==================================================

    function renderSummary(
        result
    ) {

        const metadata =
            result.metadata
            || {};

        const rows =
            result.data
            || [];

        summaryElement.innerHTML =
            "";

        const values = [

            [
                "Series",
                marketLabel(
                    marketElement.value
                )
            ],

            [
                "Rows",
                metadata.rows
                ?? rows.length
            ],

            [
                "Lines",
                metadata.series
                ?? new Set(
                    rows.map(
                        row =>
                            row.series_id
                    )
                ).size
            ],

            [
                "Frequency",
                frequencyElement
                    .options[
                        frequencyElement
                            .selectedIndex
                    ]
                    .text
            ]
        ];

        if (
            metadata.upsampled_points
        ) {

            values.push(
                [
                    "Upsampled points",
                    metadata
                        .upsampled_points
                ]
            );
        }

        for (
            const [label, value]
            of values
        ) {

            const chip =
                document.createElement(
                    "div"
                );

            chip.className =
                "summary-chip";

            chip.textContent =
                `${label}: ${value}`;

            summaryElement.appendChild(
                chip
            );
        }
    }


    // ==================================================
    // RESOLUTION NOTE
    // ==================================================

    function renderResolutionNote(
        result
    ) {

        const rows =
            result.data
            || [];

        const upsampled =
            rows.filter(
                row =>
                    row.is_upsampled
            );

        if (!upsampled.length) {

            resolutionNote.classList.add(
                "hidden"
            );

            resolutionNote.textContent =
                "";

            return;
        }

        const nativeResolutions =
            [
                ...new Set(
                    upsampled
                        .map(
                            row =>
                                row
                                    .native_resolution_minutes
                        )
                        .filter(
                            value =>
                                value !== null
                                && value !== undefined
                        )
                )
            ]
            .sort(
                (a, b) =>
                    a - b
            );

        resolutionNote.classList.remove(
            "hidden"
        );

        resolutionNote.textContent =
            (
                "Dashed sections are displayed at a finer "
                + "frequency than the official source. "
                + "The original observations remain unchanged; "
                + "the dashboard repeats each native value for "
                + "display purposes. Native resolution: "
                + nativeResolutions
                    .map(
                        value =>
                            `${value} min`
                    )
                    .join(", ")
                + "."
            );
    }


    // ==================================================
    // EVENTS
    // ==================================================

    function renderEvents(
        result
    ) {

        const events =
            result.events
            || [];

        eventsElement.innerHTML =
            "";

        if (!events.length) {
            return;
        }

        const heading =
            document.createElement(
                "div"
            );

        heading.className =
            "note";

        heading.textContent =
            "Market changes in the selected period";

        eventsElement.appendChild(
            heading
        );

        for (
            const event
            of events
        ) {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "event";

            element.innerHTML =
                `
                    <span class="event-date">
                        ${event.event_date}
                    </span>
                    —
                    <span class="event-title">
                        ${event.title}
                    </span>
                    ${
                        event.description
                            ? `<br>${event.description}`
                            : ""
                    }
                `;

            eventsElement.appendChild(
                element
            );
        }
    }


    // ==================================================
    // LOAD BUTTON
    // ==================================================

    loadButton.addEventListener(
        "click",
        async () => {

            loadButton.disabled =
                true;

            setStatus(
                "Loading official market data..."
            );

            try {

                const result =
                    await loadData();

                renderSummary(
                    result
                );

                drawChart(
                    result
                );

                renderResolutionNote(
                    result
                );

                renderEvents(
                    result
                );

                if (
                    !result.data
                    || result.data.length === 0
                ) {

                    setStatus(
                        (
                            result.metadata
                                ?.message
                            || "No official data are available for this selection."
                        ),
                        "error"
                    );

                } else {

                    setStatus(
                        (
                            `Loaded `
                            + `${result.data.length.toLocaleString()} `
                            + `display points successfully.`
                        ),
                        "success"
                    );
                }

            } catch (error) {

                console.error(
                    error
                );

                if (chart) {

                    chart.destroy();

                    chart = null;
                }

                summaryElement.innerHTML =
                    "";

                eventsElement.innerHTML =
                    "";

                resolutionNote.classList.add(
                    "hidden"
                );

                emptyMessage.classList.remove(
                    "hidden"
                );

                setStatus(
                    error.message,
                    "error"
                );

            } finally {

                loadButton.disabled =
                    false;
            }
        }
    );

</script>

</body>
</html>
